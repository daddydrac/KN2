openapi: 3.0.3
info:
  title: KN2 for GPU REST API
  version: 1.1.0
  description: GPU-resident exact cosine similarity, automatic first-insert dimension inference, cuBLAS SGEMM scoring and CUDA top-K selection.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: Process health
      responses:
        '200': {description: Service is responding}
  /v1/stats:
    get:
      summary: Index and backend statistics
      responses:
        '200': {description: Index stats}
  /v1/vectors:
    post:
      summary: Insert or overwrite one embedding
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Vector'}
      responses:
        '200': {description: Upsert successful}
        '400': {description: Invalid input}
        '409': {description: Index full}
  /v1/vectors/batch:
    post:
      summary: Insert or overwrite 1 to 1024 embeddings (one WAL fsync per HTTP batch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vectors]
              properties:
                vectors:
                  type: array
                  minItems: 1
                  maxItems: 1024
                  items: {$ref: '#/components/schemas/Vector'}
      responses:
        '200': {description: Upsert successful}
        '400': {description: Invalid input}
        '409': {description: Index full}
  /v1/vectors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
    get:
      summary: Read a stored normalized vector and its metadata
      responses:
        '200': {description: Vector found}
        '404': {description: Vector not found}
    delete:
      summary: Delete vector
      responses:
        '200': {description: Vector deleted}
        '404': {description: Vector not found}
  /v1/search:
    post:
      summary: Exact GPU cosine similarity search
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Search'}
      responses:
        '200': {description: Ranked results with IDs, cosine scores and metadata}
        '400': {description: Invalid input}
  /v1/search/batch:
    post:
      summary: GPU-batched similarity search; runs all queries as one cuBLAS matrix multiply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queries]
              properties:
                queries:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: {$ref: '#/components/schemas/Search'}
      responses:
        '200': {description: Per-query ranked results}
        '400': {description: Invalid input}
components:
  schemas:
    Vector:
      type: object
      required: [id, vector]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
        vector:
          type: array
          items: {type: number, format: float}
          description: Exact length configured with KNN_DIMENSIONS. Automatically L2-normalized.
        metadata:
          type: object
          description: Optional JSON object up to 4096 serialized bytes.
          additionalProperties: true
    Search:
      type: object
      required: [vector]
      properties:
        vector:
          type: array
          items: {type: number, format: float}
        k: {type: integer, minimum: 1, maximum: 32, default: 10}
