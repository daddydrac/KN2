    <text x="226" y="401" fill="#D921FF" text-anchor="middle" font-family="Arial" font-size="20">C++17 · HTTP / JSON</text>
    <path d="M106 430 H346" stroke="#D921FF" opacity="0.22"/><text x="226" y="548" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">Receives vector inserts, updates,</text><text x="226" y="580" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">deletes, and search requests.</text><text x="226" y="612" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">Persists mutations to the WAL.</text><path d="M810 344 l17 10 -17 10" fill="none" stroke="#27DDF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="473" y="241" width="280" height="227" rx="28" fill="#14143D" stroke="#FF8A1E" stroke-opacity="0.7" stroke-width="2"/></g>
    <circle cx="613" cy="264" r="45" fill="#FF8A1E" opacity="0.16" filter="url(#softglow)"/>
    <circle cx="613" cy="264" r="45" fill="#1B1148" stroke="#FF8A1E" stroke-width="6"/>
    <text x="613" y="279" fill="#FF8A1E" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">02</text>
    <text x="613" y="366" fill="#FFFFFF" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Query batching</text>
    <text x="613" y="401" fill="#FF8A1E" text-anchor="middle" font-family="Arial" font-size="20">Concurrent request coalescing</text>
    <path d="M493 430 H733" stroke="#FF8A1E" opacity="0.22"/><text x="613" y="548" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">Groups simultaneous queries,</text><text x="613" y="580" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">normalizes their vectors, and</text><text x="613" y="612" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">amortizes GPU computation.</text><path d="M1197 344 l17 10 -17 10" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="860" y="241" width="280" height="227" rx="28" fill="#14143D" stroke="#27DDF6" stroke-opacity="0.7" stroke-width="2"/></g>
    <circle cx="1000" cy="264" r="45" fill="#27DDF6" opacity="0.16" filter="url(#softglow)"/>
    <circle cx="1000" cy="264" r="45" fill="#1B1148" stroke="#27DDF6" stroke-width="6"/>
    <text x="1000" y="279" fill="#27DDF6" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">03</text>
    <text x="1000" y="366" fill="#FFFFFF" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">cuBLAS SGEMM</text>
    <text x="1000" y="401" fill="#27DDF6" text-anchor="middle" font-family="Arial" font-size="20">Exact cosine similarity</text>
    <path d="M880 430 H1120" stroke="#27DDF6" opacity="0.22"/><text x="1000" y="548" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">Computes the score matrix</text><text x="1000" y="580" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">against normalized GPU-resident</text><text x="1000" y="612" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">embeddings in dense batches.</text><path d="M1584 344 l17 10 -17 10" fill="none" stroke="#16F1C3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="1247" y="241" width="280" height="227" rx="28" fill="#14143D" stroke="#8B5CF6" stroke-opacity="0.7" stroke-width="2"/></g>
    <circle cx="1387" cy="264" r="45" fill="#8B5CF6" opacity="0.16" filter="url(#softglow)"/>
    <circle cx="1387" cy="264" r="45" fill="#1B1148" stroke="#8B5CF6" stroke-width="6"/>
    <text x="1387" y="279" fill="#8B5CF6" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">04</text>
    <text x="1387" y="366" fill="#FFFFFF" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">CUDA Top-K</text>
    <text x="1387" y="401" fill="#8B5CF6" text-anchor="middle" font-family="Arial" font-size="20">Two-stage parallel reduction</text>
    <path d="M1267 430 H1507" stroke="#8B5CF6" opacity="0.22"/><text x="1387" y="548" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">Reduces similarity scores</text><text x="1387" y="580" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">directly on the GPU, without</text><text x="1387" y="612" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">copying every score to CPU.</text><g filter="url(#shadow)"><rect x="1634" y="241" width="280" height="227" rx="28" fill="#14143D" stroke="#16F1C3" stroke-opacity="0.7" stroke-width="2"/></g>
    <circle cx="1774" cy="264" r="45" fill="#16F1C3" opacity="0.16" filter="url(#softglow)"/>
    <circle cx="1774" cy="264" r="45" fill="#1B1148" stroke="#16F1C3" stroke-width="6"/>
    <text x="1774" y="279" fill="#16F1C3" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">05</text>
    <text x="1774" y="366" fill="#FFFFFF" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Ranked results</text>
    <text x="1774" y="401" fill="#16F1C3" text-anchor="middle" font-family="Arial" font-size="20">IDs + scores + metadata</text>
    <path d="M1654 430 H1894" stroke="#16F1C3" opacity="0.22"/><text x="1774" y="548" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">Returns only the winning</text><text x="1774" y="580" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">matches through the REST API;</text><text x="1774" y="612" fill="#C4C5E8" text-anchor="middle" font-family="Arial" font-size="23">the full index stays on GPU.</text><g>
